<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Balloon -->
  <ellipse cx="100" cy="75" rx="50" ry="60" fill="#FF69B4"/>
  <ellipse cx="100" cy="75" rx="50" ry="60" fill="url(#balloonGrad)"/>
  <polygon points="100,135 93,145 107,145" fill="#FF1493"/>
  <!-- String -->
  <path d="M100,145 Q95,160 105,175 Q95,185 100,195" stroke="#FF69B4" stroke-width="2" fill="none"/>
  <!-- Shine -->
  <ellipse cx="82" cy="55" rx="10" ry="16" fill="rgba(255,255,255,0.3)" transform="rotate(-15,82,55)"/>
  <!-- Star on balloon -->
  <polygon points="100,50 104,62 117,62 107,70 110,82 100,74 90,82 93,70 83,62 96,62" fill="rgba(255,255,255,0.6)"/>
  <defs>
    <linearGradient id="balloonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF69B4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9B59B6" stop-opacity="0.5"/>
