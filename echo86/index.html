<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Echo86</title>
<style>
:root{--bg:#FFF0F5;--card:#FFFFFF;--txt:#2D2D2D;--muted:#9a6b7d;--accent:#FF1493;
--shadow:0 8px 30px rgba(255,105,180,.18)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{padding:28px 20px 12px;text-align:center}
header h1{margin:0;font-size:1.7rem;letter-spacing:.5px;
background:linear-gradient(135deg,#FF69B4 0%,#FF1493 50%,#9B59B6 100%);
-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header p{margin:6px 0 0;color:var(--muted)}
a{color:var(--accent);text-decoration:none}
.back{display:inline-block;margin:14px 20px 0}
.grid{display:grid;gap:10px;padding:18px;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));max-width:1200px;margin:0 auto}
.grid a{display:block;border-radius:12px;overflow:hidden;background:var(--card);
aspect-ratio:4/3;box-shadow:var(--shadow)}
.grid img{width:100%;height:100%;object-fit:cover;display:block;
transition:transform .25s ease}
.grid a:hover img{transform:scale(1.05)}
.cats{display:grid;gap:16px;padding:24px;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));max-width:1100px;margin:0 auto}
.cat{background:var(--card);border-radius:16px;overflow:hidden;
display:block;color:var(--txt);box-shadow:var(--shadow);
transition:transform .2s ease,box-shadow .2s ease}
.cat:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(255,105,180,.3)}
.cat .cover{aspect-ratio:4/3;overflow:hidden}
.cat .cover img{width:100%;height:100%;object-fit:cover}
.cat .label{padding:14px 16px;font-size:1.05rem;font-weight:600}
.cat .label span{display:block;color:var(--muted);font-weight:400;font-size:.85rem;margin-top:2px}
footer{text-align:center;color:var(--muted);padding:30px 20px;font-size:.85rem}
.poster{display:block;max-width:560px;margin:8px auto 18px;padding:0 18px}
.poster img{width:100%;height:auto;border-radius:16px;box-shadow:var(--shadow);
display:block;cursor:zoom-in}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;
align-items:center;justify-content:center;z-index:50}
.lb.open{display:flex}
.lb img{max-width:94vw;max-height:90vh;object-fit:contain}
.lb .nav{position:absolute;top:0;bottom:0;width:42%;cursor:pointer;
display:flex;align-items:center;color:#fff;font-size:2.5rem;user-select:none;opacity:.5}
.lb .nav:hover{opacity:1}
.lb .prev{left:0;justify-content:flex-start;padding-left:18px}
.lb .next{right:0;justify-content:flex-end;padding-right:18px}
.lb .close{position:absolute;top:14px;right:20px;color:#fff;font-size:2rem;
cursor:pointer;opacity:.6}
.lb .close:hover{opacity:1}
</style>
</head><body><header><h1>Echo86</h1><p>Le projet en photos</p></header><a class="poster" href="poster.jpg"><img src="poster.jpg" alt="Fiche technique BRZ"></a><div class="cats"><a class="cat" href="carbone-pieces/index.html"><div class="cover"><img loading="lazy" src="carbone-pieces/thumbs/IMG_0528.jpg" alt=""></div><div class="label">Carbone &amp; Pieces<span>24 photos</span></div></a><a class="cat" href="exterieur/index.html"><div class="cover"><img loading="lazy" src="exterieur/thumbs/IMG_polish02.jpg" alt=""></div><div class="label">Exterieur<span>33 photos</span></div></a><a class="cat" href="interieur/index.html"><div class="cover"><img loading="lazy" src="interieur/thumbs/IMG_0483.jpg" alt=""></div><div class="label">Interieur<span>15 photos</span></div></a><a class="cat" href="moteur/index.html"><div class="cover"><img loading="lazy" src="moteur/thumbs/IMG_0449.jpg" alt=""></div><div class="label">Moteur &amp; Turbo<span>54 photos</span></div></a><a class="cat" href="refroidissement/index.html"><div class="cover"><img loading="lazy" src="refroidissement/thumbs/IMG_0862.jpg" alt=""></div><div class="label">Refroidissement<span>21 photos</span></div></a><a class="cat" href="roues-freins/index.html"><div class="cover"><img loading="lazy" src="roues-freins/thumbs/IMG_0486.jpg" alt=""></div><div class="label">Roues &amp; Freins<span>21 photos</span></div></a></div><footer>Echo86</footer></body></html>
