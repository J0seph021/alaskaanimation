<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Roues &amp; Freins</title>
<style>
:root{--bg:#0d0f14;--card:#161a22;--txt:#e8eaed;--muted:#9aa0aa;--accent:#3b82f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{padding:28px 20px 12px;text-align:center}
header h1{margin:0;font-size:1.7rem;letter-spacing:.5px}
header p{margin:6px 0 0;color:var(--muted)}
a{color:var(--accent);text-decoration:none}
.back{display:inline-block;margin:14px 20px 0}
.grid{display:grid;gap:10px;padding:18px;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));max-width:1200px;margin:0 auto}
.grid a{display:block;border-radius:8px;overflow:hidden;background:var(--card);
aspect-ratio:4/3}
.grid img{width:100%;height:100%;object-fit:cover;display:block;
transition:transform .25s ease}
.grid a:hover img{transform:scale(1.05)}
.cats{display:grid;gap:16px;padding:24px;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));max-width:1100px;margin:0 auto}
.cat{background:var(--card);border-radius:12px;overflow:hidden;
display:block;color:var(--txt)}
.cat .cover{aspect-ratio:4/3;overflow:hidden}
.cat .cover img{width:100%;height:100%;object-fit:cover}
.cat .label{padding:14px 16px;font-size:1.05rem;font-weight:600}
.cat .label span{display:block;color:var(--muted);font-weight:400;font-size:.85rem;margin-top:2px}
footer{text-align:center;color:var(--muted);padding:30px 20px;font-size:.85rem}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;
align-items:center;justify-content:center;z-index:50}
.lb.open{display:flex}
.lb img{max-width:94vw;max-height:90vh;object-fit:contain}
.lb .nav{position:absolute;top:0;bottom:0;width:42%;cursor:pointer;
display:flex;align-items:center;color:#fff;font-size:2.5rem;user-select:none;opacity:.5}
.lb .nav:hover{opacity:1}
.lb .prev{left:0;justify-content:flex-start;padding-left:18px}
.lb .next{right:0;justify-content:flex-end;padding-right:18px}
.lb .close{position:absolute;top:14px;right:20px;color:#fff;font-size:2rem;
cursor:pointer;opacity:.6}
.lb .close:hover{opacity:1}
</style>
</head><body><a class="back" href="../index.html">&#8592; Toutes les categories</a><header><h1>Roues &amp; Freins</h1><p>20 photos</p></header><div class="grid"><a href="img/IMG_0460.jpg"><img loading="lazy" src="thumbs/IMG_0460.jpg" alt=""></a><a href="img/IMG_0461.jpg"><img loading="lazy" src="thumbs/IMG_0461.jpg" alt=""></a><a href="img/IMG_0462.jpg"><img loading="lazy" src="thumbs/IMG_0462.jpg" alt=""></a><a href="img/IMG_0463.jpg"><img loading="lazy" src="thumbs/IMG_0463.jpg" alt=""></a><a href="img/IMG_0464.jpg"><img loading="lazy" src="thumbs/IMG_0464.jpg" alt=""></a><a href="img/IMG_0465.jpg"><img loading="lazy" src="thumbs/IMG_0465.jpg" alt=""></a><a href="img/IMG_0475.jpg"><img loading="lazy" src="thumbs/IMG_0475.jpg" alt=""></a><a href="img/IMG_0476.jpg"><img loading="lazy" src="thumbs/IMG_0476.jpg" alt=""></a><a href="img/IMG_0477.jpg"><img loading="lazy" src="thumbs/IMG_0477.jpg" alt=""></a><a href="img/IMG_0478.jpg"><img loading="lazy" src="thumbs/IMG_0478.jpg" alt=""></a><a href="img/IMG_0479.jpg"><img loading="lazy" src="thumbs/IMG_0479.jpg" alt=""></a><a href="img/IMG_0480.jpg"><img loading="lazy" src="thumbs/IMG_0480.jpg" alt=""></a><a href="img/IMG_0486.jpg"><img loading="lazy" src="thumbs/IMG_0486.jpg" alt=""></a><a href="img/IMG_0487.jpg"><img loading="lazy" src="thumbs/IMG_0487.jpg" alt=""></a><a href="img/IMG_0488.jpg"><img loading="lazy" src="thumbs/IMG_0488.jpg" alt=""></a><a href="img/IMG_0489.jpg"><img loading="lazy" src="thumbs/IMG_0489.jpg" alt=""></a><a href="img/IMG_0490.jpg"><img loading="lazy" src="thumbs/IMG_0490.jpg" alt=""></a><a href="img/IMG_0491.jpg"><img loading="lazy" src="thumbs/IMG_0491.jpg" alt=""></a><a href="img/IMG_0492.jpg"><img loading="lazy" src="thumbs/IMG_0492.jpg" alt=""></a><a href="img/IMG_0770.jpg"><img loading="lazy" src="thumbs/IMG_0770.jpg" alt=""></a></div>
<div class="lb" id="lb">
  <div class="close" onclick="lbClose()">&times;</div>
  <div class="nav prev" onclick="lbStep(-1)">&#10094;</div>
  <img id="lbImg" src="" alt="">
  <div class="nav next" onclick="lbStep(1)">&#10095;</div>
</div>
<script>
var imgs=Array.prototype.slice.call(document.querySelectorAll('.grid a'));
var cur=0;
imgs.forEach(function(a,i){a.addEventListener('click',function(e){
  e.preventDefault();cur=i;lbOpen();});});
function lbOpen(){document.getElementById('lbImg').src=imgs[cur].getAttribute('href');
  document.getElementById('lb').classList.add('open');}
function lbClose(){document.getElementById('lb').classList.remove('open');}
function lbStep(d){cur=(cur+d+imgs.length)%imgs.length;
  document.getElementById('lbImg').src=imgs[cur].getAttribute('href');}
document.addEventListener('keydown',function(e){
  if(!document.getElementById('lb').classList.contains('open'))return;
  if(e.key==='Escape')lbClose();
  if(e.key==='ArrowLeft')lbStep(-1);
  if(e.key==='ArrowRight')lbStep(1);});
document.getElementById('lb').addEventListener('click',function(e){
  if(e.target===this)lbClose();});
</script>
<footer>Echo86</footer></body></html>
