<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FF69B4">
<title>Facturation — Alaska Animation</title>
<link rel="icon" href="../images/logo/logo-alaska-animation.png" type="image/png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <img src="../images/logo/logo-alaska-animation.png" alt="">
  <div class="brand">Facturation<span>Alaska Animation</span></div>
  <div class="spacer"></div>
  <button onclick="location.href='reglages.html'"><i class="fa-solid fa-gear"></i> Réglages</button>
  <button id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Quitter</button>
</div>

<div class="wrap">
  <div class="tabs">
    <button id="tabNew" class="active">＋ Nouvelle facture</button>
    <button id="tabList">📋 Mes factures</button>
  </div>

  <!-- ============ NOUVELLE FACTURE ============ -->
  <section id="viewNew">
    <form id="invForm">
      <div class="card">
        <div class="row">
          <div>
            <label for="invoiceNo">No de facture</label>
            <input type="text" id="invoiceNo" inputmode="numeric" placeholder="0023">
          </div>
          <div>
            <label for="invoiceDate">Date</label>
            <input type="date" id="invoiceDate">
          </div>
        </div>
      </div>

      <div class="card">
        <h2 style="margin-top:0">Client</h2>
        <label for="clientName">Nom du client *</label>
        <input type="text" id="clientName" required placeholder="Ex. Méga fête des services de garde">

        <label for="clientAddress">Adresse (optionnel)</label>
        <textarea id="clientAddress" placeholder="Rue, ville, code postal…"></textarea>

        <div class="row">
          <div>
            <label for="contactName">Personne contact</label>
            <input type="text" id="contactName" placeholder="Ex. Julie Martel">
          </div>
          <div>
            <label for="contactPhone">Téléphone</label>
            <input type="tel" id="contactPhone" placeholder="(819) 000-0000">
          </div>
        </div>
      </div>

      <div class="card">
        <h2 style="margin-top:0">Services</h2>
        <div class="items-head">
          <div>Détails</div><div>Prix</div><div>Unité</div><div>Qté</div><div>Total</div><div></div>
        </div>
        <div id="itemsList"></div>
        <button type="button" class="add-item" id="addItem">
          <i class="fa-solid fa-plus"></i> Ajouter un service
        </button>

        <div style="display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:16px">
          <label for="tax" style="margin:0">Taxe ($)</label>
          <input type="number" id="tax" value="0" min="0" step="0.01" style="width:110px">
        </div>
        <div class="totals">Total : <span id="grandTotal">0 $</span></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="saveBtn">
        <i class="fa-solid fa-floppy-disk"></i> Enregistrer la facture
      </button>
    </form>
  </section>

  <!-- ============ MES FACTURES ============ -->
  <section id="viewList" hidden>
    <div class="search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="search" id="searchBox" placeholder="Chercher par nom, no de facture…">
    </div>
    <div id="listContainer"><p class="empty">Chargement…</p></div>
  </section>
</div>

<div class="toast" id="toast"></div>
<datalist id="serviceSuggestions"></datalist>

<script type="module" src="app.js"></script>
</body>
</html>
