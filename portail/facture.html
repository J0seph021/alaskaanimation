<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F4F1E9">
<title>Facture — Alaska Animation</title>
<link rel="icon" href="../images/logo/logo-alaska-animation.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Parisienne&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  :root{ --cream:#F4F1E9; --ink:#2c2a26; --soft:#5b574e; --rule:#6f6a5f; }
  body{background:var(--cream)}
  .docwrap{max-width:660px;margin:0 auto;padding:18px 16px 40px}

  /* ---- La facture ---- */
  .fac{
    background:var(--cream);
    font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    padding:40px 46px 46px;
    font-weight:300;
  }
  .fac__title{
    font-family:"Pinyon Script",cursive;
    font-size:5rem;line-height:1;text-align:center;font-weight:400;
    margin:6px 0 40px;color:var(--ink);
  }
  .fac__lbl{font-weight:600;letter-spacing:.6px;text-transform:uppercase;font-size:.78rem}

  /* Clients / Contact */
  .fac__party{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;margin-bottom:6px}
  .fac__party .fac__lbl{padding-top:1px}
  .fac__cname{font-size:.92rem;margin-bottom:6px}
  .fac__caddr{font-size:.86rem;line-height:1.55;color:var(--soft);white-space:pre-line}
  .fac__contact{font-size:.86rem;color:var(--soft)}

  hr.fac__rule{border:none;border-top:1px solid var(--rule);margin:18px 0}

  /* Tableau */
  table.fac__table{width:100%;border-collapse:collapse}
  table.fac__table th{
    text-align:left;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
    font-size:.74rem;padding:0 4px 14px;border-bottom:1px solid var(--rule);
  }
  table.fac__table th.r,table.fac__table td.r{text-align:right}
  table.fac__table col.c-det{width:46%}
  table.fac__table col.c-prix{width:20%}
  table.fac__table col.c-qty{width:14%}
  table.fac__table col.c-tot{width:20%}
  table.fac__table td{padding:16px 4px 0;font-size:.88rem;vertical-align:top;line-height:1.4}
  table.fac__table tbody tr:first-child td{padding-top:22px}

  /* Subtotal */
  .fac__sub{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 4px;margin-top:22px;
    border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
    font-size:.9rem;
  }

  /* Bas de page : 2 colonnes */
  .fac__lower{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-top:18px}
  .fac__totals{grid-column:2;text-align:right;font-size:.9rem}
  .fac__totals .ln{display:flex;justify-content:flex-end;gap:30px;padding:3px 4px}
  .fac__totals .ln.total{font-weight:600;letter-spacing:.4px}
  .fac__meta{grid-column:1;grid-row:1;margin-top:26px;font-size:.82rem;line-height:2}
  .fac__meta .v{margin-left:8px}
  .fac__pay{grid-column:1;font-size:.78rem;line-height:1.5;color:var(--soft);margin-top:18px}
  .fac__pay .fac__lbl{display:block;color:var(--ink);margin-bottom:6px}
  .fac__sign{grid-column:2;grid-row:3;text-align:right;align-self:end}
  .fac__signname{font-family:"Parisienne",cursive;font-size:2.4rem;line-height:1;color:var(--ink)}
  .fac__signtitle{font-size:.74rem;color:var(--soft);margin-top:6px;max-width:200px;margin-left:auto}

  /* Actions (cachées à l'impression) */
  .detail-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;max-width:660px;margin-left:auto;margin-right:auto;padding:0 16px}
  .detail-actions .btn{flex:1;min-width:140px}

  @media print{
    @page{margin:16mm}
    body{background:#fff}
    .topbar,.detail-actions,.toast{display:none !important}
    .docwrap{margin:0;padding:0;max-width:none}
    .fac{padding:0;background:#fff}
  }
  @media(max-width:560px){
    .fac{padding:26px 22px 30px}
    .fac__title{font-size:3.6rem;margin-bottom:26px}
    .fac__signname{font-size:2rem}
  }
</style>
</head>
<body>

<div class="topbar">
  <img src="../images/logo/logo-alaska-animation.svg" alt="">
  <div class="brand">Facture<span>Alaska Animation</span></div>
  <div class="spacer"></div>
  <button onclick="location.href='app.html'"><i class="fa-solid fa-arrow-left"></i> Retour</button>
</div>

<div class="docwrap">
  <div id="facCard" class="fac">
    <p class="empty">Chargement…</p>
  </div>
</div>

<div class="detail-actions" id="actions" hidden>
  <button class="btn btn-ghost"   id="paidBtn"><i class="fa-regular fa-circle-check"></i> <span>Marquer payée</span></button>
  <button class="btn btn-ghost"   id="emailBtn"><i class="fa-regular fa-envelope"></i> Envoyer par courriel</button>
  <button class="btn btn-primary" id="printBtn"><i class="fa-solid fa-print"></i> Imprimer / PDF</button>
  <button class="btn btn-ghost"   id="deleteBtn" style="color:#c0392b"><i class="fa-regular fa-trash-can"></i> Supprimer</button>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="facture.js"></script>
</body>
</html>
